name: Setup Guard

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test report of every market now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: setup-guard
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan markets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python -m guard.main --test
          else
            python -m guard.main
          fi
      - name: Save memory of sent alerts (also keeps the schedule alive)
        run: |
          git config user.name "setup-guard"
          git config user.email "setup-guard@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state" -q
          git push -q || (git pull --rebase -q && git push -q)
